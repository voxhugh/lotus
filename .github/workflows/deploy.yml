name: Deploy Lotus Docs

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - notes-updated
  workflow_dispatch:
  schedule:
    # Daily fallback in case a branch notification is missed (02:17 UTC = 10:17 Singapore).
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portal configuration
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all notes branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: python -m pip install --upgrade pip mkdocs-material

      - name: Sync topic branches into docs
        run: python scripts/sync_branches.py

      - name: Build documentation
        run: mkdocs build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
